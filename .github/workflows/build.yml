name: Build APK

# Every push to main builds the debug APK; it can also be run by hand.
# The APK lands in the run's "Artifacts" section as Mercury-debug-apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build prod debug APK
        run: ./gradlew :app:assembleProdDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mercury-debug-apk
          path: app/build/outputs/apk/prodDebug/*.apk
          if-no-files-found: error
